name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to publish, for example v0.1.1
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified tarballs
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}

      - name: Verify immutable release ref
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          test "$RELEASE_REF" = "v$VERSION"
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "$RELEASE_REF"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and pack release
        run: pnpm release:check

      - name: Use current npm CLI
        run: |
          npm install --global npm@latest
          npm --version

      - name: Publish with provenance
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          # OIDC must run without setup-node token placeholders or token credentials.
          unset NODE_AUTH_TOKEN NPM_TOKEN
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          for PACKAGE_NAME in emoji-styles-data emoji-styles react-emoji-styles emoji-styles-web emoji-styles-assets-twemoji; do
            TARBALL=".release/$PACKAGE_NAME-$VERSION.tgz"
            if EXISTING_METADATA="$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity --json --registry https://registry.npmjs.org 2>/dev/null)"; then
              EXISTING_INTEGRITY="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "$EXISTING_METADATA")"
              EXPECTED_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
              if [ "$EXISTING_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
                echo "Registry bytes differ for $PACKAGE_NAME@$VERSION; refusing to continue."
                exit 1
              fi
              echo "Already published identical $PACKAGE_NAME@$VERSION; continuing."
            else
              npm publish "$TARBALL" --access public --provenance --tag "$NPM_TAG" --registry https://registry.npmjs.org
            fi
          done
